[package]
name = "hammam-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
ipc = { path = "../crates/ipc" }
memory = { path = "../crates/memory" }
scheduler = { path = "../crates/scheduler" }
x86_64 = "0.15"
bit_field = "0.10"
volatile = "0.5"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64 = "0.2"

[build-dependencies]
cc = "1.0"